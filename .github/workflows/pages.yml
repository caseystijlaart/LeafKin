name: Deploy to GitHub Pages

on:
  push:
    # pwa-* branches deploy too, for testing on a phone before merging.
    # Only one site exists, so a branch deploy replaces what main published.
    branches: [main, "pwa-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - name: Add the Pl@ntNet key from repository secrets
        env:
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
        run: |
          if [ -n "$PLANTNET_API_KEY" ]; then
            node -e 'process.stdout.write("export const PLANTNET_KEY = " + JSON.stringify(process.env.PLANTNET_API_KEY.trim()) + ";\n")' > _site/js/config.js
            echo "Pl@ntNet key added."
          else
            echo "::warning::PLANTNET_API_KEY secret is not set; scanning will ask for a key in Settings."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
