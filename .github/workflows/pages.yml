name: Deploy to GitHub Pages

on:
  push:
    # pwa-* branches deploy too, for testing on a phone before merging.
    # Only one site exists, so a branch deploy replaces what main published.
    branches: [main, "pwa-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - name: Add keys from repository secrets
        env:
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const k = (n) => JSON.stringify((process.env[n] || "").trim());
            process.stdout.write(
              "export const PLANTNET_KEY = " + k("PLANTNET_API_KEY") + ";\n" +
              "export const SUPABASE_URL = " + k("SUPABASE_URL") + ";\n" +
              "export const SUPABASE_ANON_KEY = " + k("SUPABASE_ANON_KEY") + ";\n")' > _site/js/config.js
          for n in PLANTNET_API_KEY SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!n}" ] && echo "$n added." || echo "::warning::$n secret is not set."
          done
      - name: Stamp the service worker so phones fetch fresh files after every deploy
        run: echo "// build ${GITHUB_SHA}" >> _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
