name: Deploy to GitHub Pages

# One site, two versions:
#   https://caseystijlaart.github.io/LeafKin/       ← the live app (LIVE_BRANCH)
#   https://caseystijlaart.github.io/LeafKin/beta/  ← the test version (BETA_BRANCH), with its own storage and sign-in
# A push to either branch rebuilds both.
on:
  push:
    branches: [main, "pwa-*"]
  workflow_dispatch:

env:
  LIVE_BRANCH: pwa-v2   # becomes main once v2 is merged into main
  BETA_BRANCH: pwa-beta

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the live version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIVE_BRANCH }}
          path: live
      - name: Check out the beta version
        id: beta
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BETA_BRANCH }}
          path: beta
      - name: Build the site
        env:
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          HAS_BETA: ${{ steps.beta.outcome == 'success' }}
        run: |
          set -e
          build() { # build <source dir> <target dir> <build id>
            mkdir -p "$2"
            cp -r "$1"/index.html "$1"/manifest.webmanifest "$1"/sw.js "$1"/css "$1"/js "$1"/icons "$2"/
            node -e '
              const k = (n) => JSON.stringify((process.env[n] || "").trim());
              process.stdout.write(
                "export const PLANTNET_KEY = " + k("PLANTNET_API_KEY") + ";\n" +
                "export const SUPABASE_URL = " + k("SUPABASE_URL") + ";\n" +
                "export const SUPABASE_ANON_KEY = " + k("SUPABASE_ANON_KEY") + ";\n" +
                "export const VAPID_PUBLIC_KEY = " + k("VAPID_PUBLIC_KEY") + ";\n")' > "$2/js/config.js"
            # Stamp the service worker so phones fetch fresh files after every deploy.
            echo "// build $3" >> "$2/sw.js"
          }
          build live _site "$(git -C live rev-parse HEAD)"
          if [ "$HAS_BETA" = "true" ]; then
            build beta _site/beta "$(git -C beta rev-parse HEAD)"
            # Amber icon with a β badge and an amber bar, so the beta is easy to tell apart on the Home Screen.
            [ -d beta/icons/beta ] && cp beta/icons/beta/*.png _site/beta/icons/
            sed -i 's/"name": "LeafKin"/"name": "LeafKin Beta"/; s/"short_name": "LeafKin"/"short_name": "LeafKin β"/; s/"theme_color": "#2f5d3a"/"theme_color": "#b06812"/' _site/beta/manifest.webmanifest
            sed -i 's#content="\#2f5d3a" media="(prefers-color-scheme: light)"#content="\#b06812" media="(prefers-color-scheme: light)"#' _site/beta/index.html
            sed -i 's#<title>LeafKin</title>#<title>LeafKin Beta</title>#; s#content="LeafKin">#content="LeafKin β">#' _site/beta/index.html
            echo "Beta added from $BETA_BRANCH."
          else
            echo "::notice::No $BETA_BRANCH branch yet, so only the live version was published."
          fi
          for n in PLANTNET_API_KEY SUPABASE_URL SUPABASE_ANON_KEY VAPID_PUBLIC_KEY; do
            [ -n "${!n}" ] && echo "$n added." || echo "::warning::$n secret is not set."
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
